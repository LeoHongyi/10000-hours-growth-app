<script>
        // Simple micro-interaction for the Save button
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const sticker = document.getElementById('milestone-sticker');
            sticker.classList.remove('hidden');
            sticker.classList.add('animate-bounce');
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = 'Saved!';
            btn.classList.replace('bg-tertiary', 'bg-tertiary-fixed-dim');
            btn.classList.add('pointer-events-none');

            setTimeout(() => {
                sticker.classList.add('hidden');
                sticker.classList.remove('animate-bounce');
            }, 3000);
        });

        // Numeric input constraints
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                if (input.value.length > 2) input.value = input.value.slice(0, 2);
            });
        });
    </script>
